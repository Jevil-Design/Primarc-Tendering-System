# ═══════════════════════════════════════════════════════════════
# FRONTEND ONLY — static assets, no server code.
#
# This exists so that `npx wrangler deploy` run at the REPOSITORY ROOT
# succeeds. Without it, wrangler finds no config, assumes you meant a static
# site, and fails with:
#     ✘ Could not detect a directory containing static files
#
# The API is a separate Worker with its own config in cloudflare/worker/.
# Do not merge the two: they deploy on different schedules and the API's
# cookie and CORS settings depend on the frontend being a distinct origin.
# ═══════════════════════════════════════════════════════════════

name = "primarc-tendering-system"
compatibility_date = "2026-08-01"

[assets]
directory = "./web"
# Unknown paths return index.html — the app is a single page and does its own
# routing, so a deep link must not 404.
not_found_handling = "single-page-application"
