name = "primarc-tendering-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 ──────────────────────────────────────────────────────────
# Create with:  wrangler d1 create primarc-tendering
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "primarc-tendering"
database_id = "54c449b2-9fb3-4a04-b7c0-55b2a9df653d"

# ─── R2 ──────────────────────────────────────────────────────────
# Create with:  wrangler r2 bucket create primarc-tendering-documents
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "primarc-tendering-documents"

[vars]
ENVIRONMENT = "development"
# Local dev origin (web/server.js serves the app on :8000). Never "*" — these
# APIs are cookie authenticated, and a wildcard origin with credentials is
# rejected by browsers anyway (and would be a real vulnerability if it were not).
# Comma-separate to allow more than one origin.
ALLOWED_ORIGINS = "http://localhost:8000"
SESSION_IDLE_MINUTES = "30"
SESSION_ABSOLUTE_HOURS = "12"
COOKIE_SECURE = "false"

# ─── Production ──────────────────────────────────────────────────
[env.production]
name = "primarc-tendering-api"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://primarc-tendering-system.suvojt740.workers.dev"
SESSION_IDLE_MINUTES = "30"
SESSION_ABSOLUTE_HOURS = "12"
COOKIE_SECURE = "true"

[[env.production.d1_databases]]
binding = "DB"
database_name = "primarc-tendering"
database_id = "54c449b2-9fb3-4a04-b7c0-55b2a9df653d"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "primarc-tendering-documents"

# Secrets (never in this file — set with `wrangler secret put`):
#   SESSION_PEPPER      extra entropy mixed into session token hashing
#   BOOTSTRAP_TOKEN     one-time token authorising first-admin creation
